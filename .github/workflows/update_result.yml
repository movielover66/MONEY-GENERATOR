name: Update Kolkata FF Live Result

on:
  schedule:
    - cron: '*/30 4-14 * * *'
  workflow_dispatch:

jobs:
  update-result:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Result
        run: |
          python3 -c "
          import urllib.request, re, json, datetime
          url = 'https://kolkataff.tv/'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  html = resp.read().decode('utf-8', errors='ignore')
              rows = re.findall(r'(\d{3})-(\d)', html)
              now_ist = datetime.datetime.utcnow() + datetime.timedelta(hours=5, minutes=30)
              data = {'updated_at': now_ist.isoformat(), 'today_dow': now_ist.strftime('%a'), 'prev_b8': 4, 'rounds': []}
              for idx, (p, s) in enumerate(rows[:8], start=1):
                  data['rounds'].append({'baji': idx, 'patti': p, 'single': int(s)})
              with open('live_result.json', 'w') as f:
                  json.dump(data, f, indent=2)
          except Exception as e:
              print(e)
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add live_result.json
          git diff --staged --quiet || (git commit -m 'chore: auto-sync live result [skip ci]' && git push)
